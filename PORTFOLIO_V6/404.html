<!DOCTYPE html>
<html lang="en">

	<header class="topbar">
		<a class="brand" href="/" aria-label="Ardit Hasangjekaj, home">
			<img src="/images/web/logo.png" width="30" height="30" alt="" />
			<span>Ardit Hasangjekaj</span>
		</a>
	</header>
	<main class="wrap missing">
		<p class="eyebrow">Error 404</p>
		<h1>Page not found</h1>

		<div class="actions">
			<a class="btn btn--primary" href="/#client">Watch the work</a>
